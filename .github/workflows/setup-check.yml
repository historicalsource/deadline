name: setup-check

on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midterm-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: midterm-game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
